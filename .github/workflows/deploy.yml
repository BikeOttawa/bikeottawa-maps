name: Deploy
on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # Nightly, a little after 3 am in Ottawa.
    # Off the hour on purpose: GitHub delays or drops schedules set for :00.
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: pages
  cancel-in-progress: false

# Three jobs: site (checks, tiles, Pages build, site image), router (the router
# image) in parallel with it, and deploy (Pages), which waits only for site.
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # osmium and tippecanoe come from conda-forge, not apt: hosted runners cannot
      # always reach Ubuntu's archive (actions/runner-images#15296).
      - name: Install tile tools
        run: |
          curl -fsSL https://micro.mamba.pm/api/micromamba/linux-64/2.3.3 | tar -xj -C "$RUNNER_TEMP" bin/micromamba
          "$RUNNER_TEMP/bin/micromamba" create -y -q -r "$RUNNER_TEMP/mamba" -p "$RUNNER_TEMP/tools" \
            -c conda-forge osmium-tool=1.19 tippecanoe=2.79
          for tool in osmium tippecanoe; do
            printf '#!/bin/sh\nexec %s "$@"\n' "$RUNNER_TEMP/tools/bin/$tool" | sudo tee /usr/local/bin/$tool >/dev/null
            sudo chmod +x /usr/local/bin/$tool
          done
          pipx install osmium # pyosmium-up-to-date, which applies OSM's change files
          curl -fsSL https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin pmtiles
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Basemap cache key (refreshes monthly)
        id: month
        run: echo "value=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: basemap
        with:
          path: |
            web/public/tiles/basemap.pmtiles
            web/public/basemap-assets
          key: basemap-${{ hashFiles('region.json', 'pipeline/build-basemap.sh') }}-${{ steps.month.outputs.value }}
      - if: steps.basemap.outputs.cache-hit != 'true'
        run: npm run basemap
      # The region's OSM data carries over from run to run and is only topped up
      # with the latest changes. Every run saves its own copy; the newest is restored.
      - uses: actions/cache@v6
        with:
          path: |
            .cache/osm/region.osm.pbf
            .cache/osm/*.poly
          key: osm-${{ hashFiles('region.json', 'pipeline/update-osm.sh') }}-${{ github.run_id }}
          restore-keys: osm-${{ hashFiles('region.json', 'pipeline/update-osm.sh') }}-
      - run: npm run tiles
      # GitHub Pages: main only, served under /<repo>/. The route planner shows
      # there once the ROUTER_URL repository variable points at a running router.
      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
        id: pages
      - if: github.ref == 'refs/heads/main'
        run: npm run build -w web -- --base "${{ steps.pages.outputs.base_path }}/"
        env:
          VITE_ROUTER_URL: ${{ vars.ROUTER_URL }}
          # Mapillary client token (public by design) for photos in place cards; links only without it.
          VITE_MAPILLARY_TOKEN: ${{ vars.MAPILLARY_TOKEN }}
          # Fotoshi browser key, approved by Fotoshi for this site's address, for photos in cards.
          VITE_FOTOSHI_KEY: ${{ vars.FOTOSHI_KEY }}
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      # Docker image of the site, with the tiles baked in.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: image
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # osmium from conda-forge, not apt (see the site job).
      - name: Install OSM tools
        run: |
          curl -fsSL https://micro.mamba.pm/api/micromamba/linux-64/2.3.3 | tar -xj -C "$RUNNER_TEMP" bin/micromamba
          "$RUNNER_TEMP/bin/micromamba" create -y -q -r "$RUNNER_TEMP/mamba" -p "$RUNNER_TEMP/tools" \
            -c conda-forge osmium-tool=1.19
          printf '#!/bin/sh\nexec %s "$@"\n' "$RUNNER_TEMP/tools/bin/osmium" | sudo tee /usr/local/bin/osmium >/dev/null
          sudo chmod +x /usr/local/bin/osmium
          pipx install osmium # pyosmium-up-to-date
      # The OSM data the site job saved last time, brought up to date here; only
      # the site job saves it, so the two jobs do not race to write the cache.
      - uses: actions/cache/restore@v6
        with:
          path: |
            .cache/osm/region.osm.pbf
            .cache/osm/*.poly
          key: osm-${{ hashFiles('region.json', 'pipeline/update-osm.sh') }}-${{ github.run_id }}
          restore-keys: osm-${{ hashFiles('region.json', 'pipeline/update-osm.sh') }}-
      - run: pipeline/update-osm.sh
      - uses: actions/cache@v6
        with:
          path: routing/data/elevation
          key: elevation-${{ hashFiles('region.json', 'routing/prepare-data.sh') }}
      - run: routing/prepare-data.sh
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: router-image
        with:
          images: ghcr.io/${{ github.repository }}-router
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        id: router-build
        with:
          context: routing
          push: true
          tags: ${{ steps.router-image.outputs.tags }}
          labels: ${{ steps.router-image.outputs.labels }}

      # Cloud Run, from main, once it is set up (docs/deployment.md). The new
      # revision takes traffic only after it plans a route by bike and on foot.
      - if: github.ref == 'refs/heads/main' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - if: github.ref == 'refs/heads/main' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/setup-gcloud@v3
      - if: github.ref == 'refs/heads/main' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        name: Deploy the router to Cloud Run
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          DIGEST: ${{ steps.router-build.outputs.digest }}
        run: |
          # Through the project's mirror of ghcr.io, by digest: the mirror can keep serving an older `main`.
          image="$REGION-docker.pkg.dev/$PROJECT/ghcr/${GITHUB_REPOSITORY,,}-router@$DIGEST"
          where=(--project "$PROJECT" --region "$REGION")
          gcloud run services update "$SERVICE" "${where[@]}" --image "$image" --no-traffic --tag next
          url=$(gcloud run services describe "$SERVICE" "${where[@]}" --format=json \
            | jq -r '.status.traffic[] | select(.tag == "next") | .url')
          for profile in ottbike ottwalk; do
            curl -fsS --retry 3 --max-time 60 \
              "$url/brouter?lonlats=-75.6972,45.4215|-75.6900,45.4200&profile=$profile&alternativeidx=0&format=geojson" \
              | grep -q LineString || { echo "The new router did not plan a route with $profile" >&2; exit 1; }
          done
          gcloud run services update-traffic "$SERVICE" "${where[@]}" --to-latest

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
